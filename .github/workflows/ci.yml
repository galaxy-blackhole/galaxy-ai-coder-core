name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # A hung suite used to burn hours: bound the job so a red run reports instead of stalling.
    timeout-minutes: 20
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm ci
        working-directory: testing
      # `test:local` also runs the integration and e2e suites, which need a live environment; CI keeps
      # the hermetic part (types + the unit audit) and leaves the rest to a lab machine.
      - run: npm run typecheck:local && npm run test:unit
        working-directory: testing
