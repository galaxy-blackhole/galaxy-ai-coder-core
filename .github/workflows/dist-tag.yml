name: dist-tag

# Promote an already-published version to a dist-tag (e.g. latest) using OIDC
# trusted publishing. Kept separate from publish.yml so prereleases stay off
# latest unless a maintainer explicitly dispatches this workflow.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Dist-tag to point at the current package.json version
        required: true
        default: latest

permissions:
  contents: read
  id-token: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@^11.5.1
      - name: Move dist-tag
        run: |
          version=$(node -p "require('./package.json').version")
          echo "Promoting @galaxy-stack/ai-coder-core@$version to ${{ inputs.tag }}"
          npm dist-tag add "@galaxy-stack/ai-coder-core@$version" "${{ inputs.tag }}"
          npm view "@galaxy-stack/ai-coder-core" dist-tags --json
